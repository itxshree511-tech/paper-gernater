<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Paper Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="container">
        <h1>Interactive Class Paper Generator</h1>

        <!-- Classes -->
        <div class="classes-container">
            <div class="class-card" data-class="9">9th Class</div>
            <div class="class-card" data-class="10">10th Class</div>
            <div class="class-card" data-class="11">11th Class</div>
            <div class="class-card" data-class="12">12th Class</div>
        </div>

        <!-- Subjects -->
        <div id="subjectsContainer" class="subjects-container"></div>

        <!-- MCQ Spacing Slider -->
        <label>MCQ Option Spacing: <span id="gapValue">20</span>px</label>
        <input type="range" id="spacingSlider" min="5" max="50" value="20">

        <!-- Paper Output -->
        <div id="paperOutput" class="paper-output" contenteditable="true"></div>

        <!-- Download Button -->
        <button id="downloadBtn" class="download-btn" onclick="downloadWord()">Download Word</button>

        <p style="font-size:12px; color:#555;">*You can edit the paper above before downloading*</p>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
