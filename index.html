<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sir toqeer|Paper Generator</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #26d7ee;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 4vw;
            color: #000000;
            margin-bottom: 20px;

        }

        .classes-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .class-card {
            flex: 1;
            min-width: 150px;
            background: #ff7675;
            padding: 20px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.5rem;
            cursor: pointer;
            color: #333;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .class-card:nth-child(2) {
            background: #74b9ff;
        }

        .class-card:nth-child(3) {
            background: #55efc4;
        }

        .class-card:nth-child(4) {
            background: #fdcb6e;
        }

        .class-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .subjects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .subject-card {
            background: #6c5ce7;
            color: white;
            padding: 15px;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .paper-output {
            min-height: 40vh;
            text-align: left;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin: 2vw;
            overflow-x: auto;
        }

        /* Page break & styling for PDF */
        .paper {
            page-break-inside: avoid;
            font-family: "Times New Roman", serif;
            margin: 1vw;
            padding: 2vw;
        }

        .section {
            page-break-inside: avoid;
            margin-bottom: 20px;
        }

        .paper-header {
            page-break-after: avoid;
        }

        .section ol {
            padding-left: 20px;
        }

        .section li {
            margin-bottom: 12px;
        }

        /* MCQ Horizontal Options */
        .mcq-options {
            display: flex;
            gap: 20px;
            list-style-type: none;
            padding-left: 0;
            flex-wrap: wrap;
        }

        .mcq-options li::before {
            content: attr(data-label) ") ";
            font-weight: bold;
        }

        .download-btn {
            padding: 15px 30px;
            background: #09a0db;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .download-btn:hover {
            background: #019875;
            transform: scale(1.05);
        }

        @media(max-width:600px) {
            .classes-container {
                flex-direction: column;
                align-items: center;
            }

            .class-card {
                width: 80%;
                margin-bottom: 10px;
            }
        }

        label {
            cursor: pointer;
            margin-bottom: 1vw;
        }

        .paper-header h2,
        .paper-header p {
            margin: 0;
        }

        .section h3 {
            background: #f2f2f2;
            padding: 8px 12px;
            border-left: 5px solid #333;
            font-size: 14pt;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 14px;
            margin-bottom: 6px;
            border-bottom: 1px solid #000;

        }
    </style>
</head>

        { question: "Quran ka pehla kalma?", options: ["La ilaha illallah", "Bismillah", "Allah", "Muhammad"], answer: "Bismillah" },
        { question: "Quran kitne juz hain?", options: ["30", "29", "28", "31"], answer: "30" },
        { question: "Allah ka naam kitni martaba aya?", options: ["500", "1000", "200", "600"], answer: "500" }];
        const Physics12_short = ["Define prime number.",
            "Find HCF of 12 and 18.",
            "Write formula for area of circle.",
            "Simplify: 3/4 + 2/5",
            "Find LCM of 4 and 6"];
        const Physics12_long = ["Define prime number.",
            "Find HCF of 12 and 18.",
            "Write formula for area of circle.",
            "Simplify: 3/4 + 2/5",
            "Find LCM of 4 and 6"];

        // Repeat for all 12th subjects

        // ==========================
        // Class Subjects
        // ==========================
        const classSubjects = {
            "9": ["Math", "Physics", "Chemistry", "Biology", "Computer", "English", "Urdu", "Islamiat", "Pak Studies", "Tarjuma tul Quran"],
            "10": ["Math", "Physics", "Chemistry", "Biology", "Computer", "English", "Urdu", "Islamiat", "Pak Studies", "Tarjuma tul Quran"],
            "11": ["Math", "Physics", "Chemistry", "Biology", "Computer", "English", "Urdu", "Islamiat", "Pak Studies", "Tarjuma tul Quran"],
            "12": ["Math", "Physics", "Chemistry", "Biology", "Computer", "English", "Urdu", "Islamiat", "Pak Studies", "Tarjuma tul Quran"]
        };

        // ==========================
        // Question Bank
        // ==========================
        const questionBank = {
            "9": {
                "Math": { mcq: Math9_mcq, short: Math9_short, long: Math9_long },
                "Physics": { mcq: Physics9_mcq, short: Physics9_short, long: Physics9_long },
                "Chemistry": { mcq: Chemistry9_mcq, short: Chemistry9_short, long: Chemistry9_long },
                "Biology": { mcq: Biology9_mcq, short: Biology9_short, long: Biology9_long },
                "Computer": { mcq: Computer9_mcq, short: Computer9_short, long: Computer9_long },
                "English": { mcq: English9_mcq, short: English9_short, long: English9_long },
                "Urdu": { mcq: Urdu9_mcq, short: Urdu9_short, long: Urdu9_long },
                "Islamiat": { mcq: Islamiat9_mcq, short: Islamiat9_short, long: Islamiat9_long },
                "Pak Studies": { mcq: PakStudies9_mcq, short: PakStudies9_short, long: PakStudies9_long },
                "Tarjuma tul Quran": { mcq: TarjumaQuran9_mcq, short: TarjumaQuran9_short, long: TarjumaQuran9_long }
            },

            "10": {
                "Math": { mcq: Math10_mcq, short: Math10_short, long: Math10_long },
                "Physics": { mcq: Physics10_mcq, short: Physics10_short, long: Physics10_long },
                // add Chemistry, Biology, etc. same way
            },
            "11": {
                "Math": { mcq: Math11_mcq, short: Math11_short, long: Math11_long },
                "Physics": { mcq: Physics11_mcq, short: Physics11_short, long: Physics11_long },
                // add Chemistry, Biology, etc.
            },
            "12": {
                "Math": { mcq: Math12_mcq, short: Math12_short, long: Math12_long },
                "Physics": { mcq: Physics12_mcq, short: Physics12_short, long: Physics12_long },
                // add Chemistry, Biology, etc.
            }


        };

        // ==========================
        // Class & Subject Cards
        // ==========================
        const classCards = document.querySelectorAll('.class-card');
        const subjectsContainer = document.getElementById('subjectsContainer');

        classCards.forEach(card => {
            card.addEventListener('click', () => {
                const cls = card.dataset.class;
                const subjects = classSubjects[cls] || [];
                subjectsContainer.innerHTML = '';

                subjects.forEach(sub => {
                    const subCard = document.createElement('div');
                    subCard.classList.add('subject-card');
                    subCard.innerText = sub;
                    subCard.addEventListener('click', () => generatePaper(cls, sub));
                    subjectsContainer.appendChild(subCard);
                });

                gsap.from(".subject-card", { opacity: 0, y: 30, stagger: 0.1, duration: 0.5 });
            });
        });

        // ==========================
        // MCQ Spacing Slider
        // ==========================
        const slider = document.getElementById("spacingSlider");
        const gapValue = document.getElementById("gapValue");

        slider.addEventListener("input", () => {
            gapValue.innerText = slider.value;
            document.querySelectorAll(".mcq-options").forEach(ul => {
                ul.style.gap = slider.value + "px";
            });
        });

        // ==========================
        // Utility
        // ==========================
        function getRandomItems(arr, count) {
            return [...arr].sort(() => 0.5 - Math.random()).slice(0, count);
        }

        // ==========================
        // Generate Paper
        // ==========================
        function generatePaper(cls, sub) {
            const mcqs = questionBank[cls]?.[sub]?.mcq || [];
            const shortQs = questionBank[cls]?.[sub]?.short || [];
            const longQs = questionBank[cls]?.[sub]?.long || [];

            if (mcqs.length === 0 && shortQs.length === 0 && longQs.length === 0) {
                alert("No questions available for this class & subject!");
                return;
            }

            const MCQ_COUNT = Math.min(10, mcqs.length);
            const SHORT_COUNT = Math.min(10, shortQs.length);
            const LONG_COUNT = Math.min(3, longQs.length);

            const MCQ_MARKS = 1, SHORT_MARKS = 2, LONG_MARKS = 5;
            const totalMarks = (MCQ_COUNT * MCQ_MARKS) + (SHORT_COUNT * SHORT_MARKS) + (LONG_COUNT * LONG_MARKS);

            const selectedMCQs = getRandomItems(mcqs, MCQ_COUNT);
            const selectedShort = getRandomItems(shortQs, SHORT_COUNT);
            const selectedLong = getRandomItems(longQs, LONG_COUNT);

            let html = `<div class="paper">
    <div class="paper-header">
      <h2>Board Examination – Class ${cls}</h2>
      <p><strong>Subject:</strong> ${sub}</p>
      <p><strong>Time:</strong> 3 Hours &nbsp;|&nbsp; <strong>Total Marks:</strong> ${totalMarks}</p>
      <hr>
      <p><strong>Instructions:</strong></p>
      <ul>
        <li>Attempt all MCQs.</li>
        <li>Attempt all short questions.</li>
        <li>Attempt all long questions.</li>
      </ul>
    </div>`;

            // MCQs Horizontal
            html += `<div class="section">
    <h3>Section A: MCQs (${MCQ_COUNT} × ${MCQ_MARKS})</h3>
    <ol>`;
            selectedMCQs.forEach((q) => {
                html += `<li>${q.question}
      <ul class="mcq-options">
        <li data-label="a">${q.options[0]}</li>
        <li data-label="b">${q.options[1]}</li>
        <li data-label="c">${q.options[2]}</li>
        <li data-label="d">${q.options[3]}</li>
      </ul>
    </li>`;
            });
            html += `</ol></div>`;

            // Short
            html += `<div class="section">
    <h3>Section B: Short Questions (${SHORT_COUNT} × ${SHORT_MARKS})</h3>
    <ol>${selectedShort.map(q => `<li>${q}</li>`).join("")}</ol></div>`;

            // Long
            html += `<div class="section">
    <h3>Section C: Long Questions (${LONG_COUNT} × ${LONG_MARKS})</h3>
    <ol>${selectedLong.map(q => `<li>${q}</li>`).join("")}</ol></div></div>`;

            document.getElementById("paperOutput").innerHTML = html;
        }

        // download section


        function downloadWord() {
            const paper = document.getElementById("paperOutput");

            if (!paper || paper.innerHTML.trim() === "") {
                alert("Please generate paper first!");
                return;
            }

            // Ask file name
            let fileName = prompt("Enter file name (without .doc):", "Board_Exam_Class_9");
            if (!fileName) return;
            fileName = fileName.replace(/[^a-z0-9_-]/gi, "_");

            let content = paper.innerHTML;

            // ✅ MCQ FIX: a) b) c) d) SAME LINE (Word-safe)
            content = content.replace(
                /<ul class="mcq-options">([\s\S]*?)<\/ul>/g,
                (_, options) => {
                    const items = options.match(/<li.*?>(.*?)<\/li>/g);
                    if (!items) return options;

                    const labels = ["a)", "b)", "c)", "d)"];

                    return `
      <table width="100%" cellspacing="0" cellpadding="3">
        <tr>
          ${items.map((i, index) =>
                        `<td width="25%" style="border:none;font-size:12pt;">
              <strong>${labels[index]}</strong> ${i.replace(/<[^>]+>/g, "")}
            </td>`
                    ).join("")}
        </tr>
      </table>`;
                }
            );

            const html = `
  <html xmlns:o="urn:schemas-microsoft-com:office:office"
        xmlns:w="urn:schemas-microsoft-com:office:word"
        xmlns="http://www.w3.org/TR/REC-html40">
  <head>
    <meta charset="utf-8">
    <title>${fileName}</title>

    <style>
      @page {
        size: A4;
        margin: 15mm;
      }

      body {
        font-family: "Times New Roman";
        font-size: 12pt;
        line-height: 1.25;
      }

      .main-title {
        text-align: center;
        font-size: 24pt;
        font-weight: bold;
        letter-spacing: 1px;
        margin-bottom: 6px;
      }

      .sub-title {
        text-align: center;
        font-size: 14pt;
        margin-bottom: 12px;
      }

      h3 {
        text-align: center;
        margin: 6px 0;
      }

      p, li {
        margin: 4px 0;
      }

      table {
        margin-top: 4px;
      }
    </style>
  </head>

  <body>

    <!-- 🔥 PROFESSIONAL TITLE -->
    <div class="main-title">BOARD EXAMINATION – CLASS 9</div>
    <div class="sub-title">Annual Examination Question Paper</div>
    <hr>

    ${content}

  </body>
  </html>`;

            const blob = new Blob(["\ufeff" + html], {
                type: "application/msword"
            });

            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName + ".doc";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }


// download jpg ===========

// ========================
function downloadImage() {

    const paper = document.querySelector("#paperOutput .paper");

    if (!paper) {
        alert("Please generate paper first!");
        return;
    }

    let fileName = prompt("Enter file name:", "Board_Exam_Paper");
    if (!fileName) return;

    html2canvas(paper, {
        scale: 3,                 // high quality
        backgroundColor: "#ffffff",
        useCORS: true,
        scrollX: 0,
        scrollY: -window.scrollY
    }).then(canvas => {

        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png", 1.0);
        link.download = fileName + ".png";

        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
}



    </script>


</body>
